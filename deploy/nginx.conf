# Reuse the server's valid *.freeman.fit certificate.
server {
    listen 80;
    server_name ai.freeman.fit 123.56.112.41;
    return 301 https://ai.freeman.fit$request_uri;
}

server {
    listen 443 ssl;
    server_name ai.freeman.fit;
    ssl_certificate /etc/nginx/cert/freeman.pem;
    ssl_certificate_key /etc/nginx/cert/freeman.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1k;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
